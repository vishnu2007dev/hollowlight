# Weekly PRs for outdated or vulnerable npm packages and GitHub Actions (including the pinned SHAs).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Phaser 4 is a breaking rewrite of the API; upgrading is a deliberate project, not a bot PR.
      - dependency-name: phaser
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
